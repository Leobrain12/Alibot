spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:alibot-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

app:
  internal-api-key: test-api-key
  media:
    storage-dir: ./build/test-media
    retention-cron: 0 0 3 * * *
  schedule:
    daily-report-cron: 0 0 20 * * *
    timers-cron: 0 */5 * * * *
  crm:
    retry-cron: 0 * * * * *
